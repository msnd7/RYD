<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="رياض القرآن">
  <defs>
    <linearGradient id="dome" x1="0" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#fff7e3"/><stop offset=".55" stop-color="#ffd77a"/><stop offset="1" stop-color="#f7941e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a41c"/><stop offset="1" stop-color="#b5762a"/>
    </linearGradient>
    <linearGradient id="min" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f7941e"/><stop offset="1" stop-color="#ffc63f"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ac46a"/><stop offset=".5" stop-color="#55963a"/><stop offset="1" stop-color="#8ac46a"/>
    </linearGradient>
  </defs>
  <!-- minaret -->
  <path d="M92 96V44c0-7 4-12 7-18 3 6 7 11 7 18v52z" fill="url(#min)"/>
  <rect x="106" y="52" width="11" height="7" rx="2" fill="#f7941e"/>
  <path d="M99 20a6 6 0 1 1-4.6-5.8A4.6 4.6 0 1 0 99 20z" fill="#f9ad24"/>
  <rect x="98" y="24" width="3" height="7" rx="1.5" fill="#f9ad24"/>
  <!-- dome body -->
  <path d="M26 96c0-22 12-38 30-38s30 16 30 38z" fill="url(#dome)"/>
  <!-- dome outline arc -->
  <path d="M20 96c0-27 15-46 36-46s36 19 36 46h-8c0-23-12-38-28-38S28 73 28 96z" fill="url(#arc)"/>
  <!-- small crescent -->
  <path d="M56 40a5.5 5.5 0 1 1-4.2-5.3A4.2 4.2 0 1 0 56 40z" fill="#f9ad24"/>
  <rect x="55.4" y="43.5" width="2.6" height="6" rx="1.3" fill="#f9ad24"/>
  <!-- book / quran mark -->
  <path d="M44 82c5-3 10-3 14 0 4-3 9-3 14 0v10c-5-3-10-3-14 0-4-3-9-3-14 0z" fill="#0f4c81"/>
  <path d="M58 82v10" stroke="#d7e9f7" stroke-width="1.6"/>
  <!-- grass swoosh -->
  <path d="M8 108c18-14 38-21 56-21s38 7 56 21c-18-6-37-9-56-9s-38 3-56 9z" fill="url(#grass)"/>
